
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intranet de Résidence Adoma (POC UX)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-red-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const AdomaLogo = () => (
      <div className="flex items-center space-x-2 bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm">
        <svg className="h-7 w-auto" viewBox="0 0 280 45" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="38" height="38" rx="4" fill="#E30613"/>
          <text x="7" y="27" fill="white" fontFamily="Arial" fontWeight="bold" fontSize="20">cdc</text>
          <text x="48" y="27" fill="#1E293B" fontFamily="Arial" fontWeight="bold" fontSize="20">habitat</text>
          <text x="135" y="38" fill="#64748B" fontFamily="Arial" fontWeight="bold" fontSize="13">Adoma</text>
          <line x1="185" y1="5" x2="185" y2="38" stroke="#CBD5E1" strokeWidth="1.5"/>
          <rect x="195" y="5" width="75" height="33" rx="2" fill="#E30613"/>
          <text x="200" y="20" fill="white" fontFamily="Arial" fontWeight="bold" fontSize="8">Caisse</text>
          <text x="200" y="29" fill="white" fontFamily="Arial" fontWeight="bold" fontSize="8">des Dépôts</text>
          <text x="200" y="36" fill="white" fontFamily="Arial" fontWeight="bold" fontSize="5">GROUPE</text>
        </svg>
      </div>
    );

    function App() {
      const [viewMode, setViewMode] = useState('resident'); // resident, admin, kiosk
      const [activeTab, setActiveTab] = useState('actu');
      const [lang, setLang] = useState('FR');
      const [showModal, setShowModal] = useState(false);
      const [incidentText, setIncidentText] = useState('');
      
      const [posts, setPosts] = useState([
        { id: 1, type: 'urgence', title: 'Coupure d\'eau temporaire - Bâtiment B', date: 'Aujourd\'hui, 09:00 - 12:00', desc: 'Intervention technique en cours sur la colonne principale. Merci de bien fermer vos robinets.', author: 'Responsable de résidence' },
        { id: 2, type: 'event', title: 'Café partagé & Rencontre des voisins', date: 'Mardi prochain à 14h30', desc: 'Venez passer un moment convivial au rez-de-chaussée avec l\'équipe d\'animation et les résidents.', author: 'Équipe d\'animation' },
        { id: 3, type: 'info', title: 'Permanence d\'accompagnement social', date: 'Jeudi de 10h à 12h', desc: 'Un conseiller est à votre disposition au bureau d\'accueil pour vos démarches administratives.', author: 'Action Sociale' }
      ]);

      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = lang === 'EN' ? 'en-US' : 'fr-FR';
          window.speechSynthesis.speak(utterance);
        }
      };

      const handleIncidentSubmit = (e) => {
        e.preventDefault();
        if(!incidentText) return;
        const newItem = {
          id: Date.now(),
          type: 'urgence',
          title: 'Signalement résident : ' + incidentText.slice(0, 30) + '...',
          date: 'À l\'instant',
          desc: incidentText,
          author: 'Résident (Anonymisé)'
        };
        setPosts([newItem, ...posts]);
        setIncidentText('');
        setShowModal(false);
        alert('Votre signalement a bien été transmis aux équipes Adoma.');
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
          
          {/* BARRE DE NAVIGATION PRINCIPALE (POC UI) */}
          <header className="bg-[#0F172A] text-white px-4 py-3 shadow-md flex flex-wrap justify-between items-center gap-4">
            <div className="flex items-center space-x-3">
              <AdomaLogo />
              <div>
                <div className="flex items-center space-x-2">
                  <h1 className="text-sm font-extrabold tracking-wide">Intranet de Résidence</h1>
                  <span className="bg-[#E30613] text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">POC UX</span>
                </div>
                <p className="text-[11px] text-slate-400">Vaulx-en-Velin "Les Oliviers"</p>
              </div>
            </div>

            {/* Sélecteur de Vues */}
            <div className="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-700">
              <button onClick={() => setViewMode('resident')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${viewMode === 'resident' ? 'bg-[#E30613] text-white shadow' : 'text-slate-300 hover:text-white'}`}>
                📱 Vue Résident
              </button>
              <button onClick={() => setViewMode('admin')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${viewMode === 'admin' ? 'bg-[#E30613] text-white shadow' : 'text-slate-300 hover:text-white'}`}>
                ⚙️ Console Resp.
              </button>
              <button onClick={() => setViewMode('kiosk')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${viewMode === 'kiosk' ? 'bg-[#E30613] text-white shadow' : 'text-slate-300 hover:text-white'}`}>
                📺 Affichage Hall
              </button>
            </div>

            {/* Sélecteur de Langue FALC */}
            <div className="flex items-center space-x-1 bg-slate-800 px-2 py-1 rounded-xl border border-slate-700">
              <span className="text-xs">🌐</span>
              {['FR', 'EN', 'العربية', 'PY'].map((l) => (
                <button key={l} onClick={() => setLang(l)} className={`px-2 py-0.5 rounded text-xs font-bold transition ${lang === l ? 'bg-white text-slate-900' : 'text-slate-300 hover:text-white'}`}>
                  {l}
                </button>
              ))}
            </div>
          </header>

          {/* VUE RÉSIDENT COMPLÈTE */}
          {viewMode === 'resident' && (
            <main className="max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6 flex-1">
              
              {/* En-tête de bienvenue & CTA Panne */}
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div className="space-y-1">
                  <span className="inline-block bg-red-50 text-[#E30613] text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">
                    🏠 RÉSIDENCE LES OLIVIERS
                  </span>
                  <h2 className="text-2xl font-extrabold text-slate-900">Bienvenue dans votre résidence</h2>
                  <p className="text-sm text-slate-500">Retrouvez ici les informations utiles, vos événements et vos contacts de proximité.</p>
                </div>
                <button onClick={() => setShowModal(true)} className="bg-[#E30613] hover:bg-red-700 text-white font-bold px-5 py-3 rounded-2xl shadow-md transition flex items-center space-x-2 text-sm">
                  <span>🔧</span>
                  <span>Signaler une panne</span>
                </button>
              </div>

              {/* Grille des 4 onglets principaux */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onClick={() => setActiveTab('actu')} className={`p-5 rounded-2xl border text-center flex flex-col items-center justify-center space-y-2 transition ${activeTab === 'actu' ? 'bg-white border-[#E30613] ring-2 ring-red-500/20 shadow-md' : 'bg-white border-slate-200 hover:border-slate-300'}`}>
                  <span className="text-2xl">🔔</span>
                  <span className="font-bold text-slate-800 text-xs">Actualités & Alertes</span>
                </button>
                <button onClick={() => setActiveTab('vie')} className={`p-5 rounded-2xl border text-center flex flex-col items-center justify-center space-y-2 transition ${activeTab === 'vie' ? 'bg-white border-[#E30613] ring-2 ring-red-500/20 shadow-md' : 'bg-white border-slate-200 hover:border-slate-300'}`}>
                  <span className="text-2xl">📅</span>
                  <span className="font-bold text-slate-800 text-xs">Vie & Animations</span>
                </button>
                <button onClick={() => setActiveTab('guides')} className={`p-5 rounded-2xl border text-center flex flex-col items-center justify-center space-y-2 transition ${activeTab === 'guides' ? 'bg-white border-[#E30613] ring-2 ring-red-500/20 shadow-md' : 'bg-white border-slate-200 hover:border-slate-300'}`}>
                  <span className="text-2xl">ℹ️</span>
                  <span className="font-bold text-slate-800 text-xs">Guides Pratiques</span>
                </button>
                <button onClick={() => setActiveTab('equipe')} className={`p-5 rounded-2xl border text-center flex flex-col items-center justify-center space-y-2 transition ${activeTab === 'equipe' ? 'bg-white border-[#E30613] ring-2 ring-red-500/20 shadow-md' : 'bg-white border-slate-200 hover:border-slate-300'}`}>
                  <span className="text-2xl">👥</span>
                  <span className="font-bold text-slate-800 text-xs">Mon Équipe</span>
                </button>
              </div>

              {/* Flux de contenu dynamique */}
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <span className="w-2 h-6 bg-[#E30613] rounded-full"></span>
                    <h3 className="text-base font-extrabold text-slate-900">
                      {activeTab === 'actu' && 'En ce moment (Actualités & Alertes)'}
                      {activeTab === 'vie' && 'Agenda des animations de la résidence'}
                      {activeTab === 'guides' && 'Documents utiles et règlement (FALC)'}
                      {activeTab === 'equipe' && 'Votre équipe de proximité Adoma'}
                    </h3>
                  </div>
                  <span className="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-bold">{posts.length} messages</span>
                </div>

                {activeTab === 'actu' && (
                  <div className="space-y-4">
                    {posts.map((post) => (
                      <div key={post.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase ${post.type === 'urgence' ? 'bg-red-100 text-[#E30613]' : 'bg-blue-100 text-blue-800'}`}>
                            {post.type}
                          </span>
                          <span className="text-xs text-slate-400">{post.date}</span>
                        </div>
                        <h4 className="font-bold text-slate-900 text-sm">{post.title}</h4>
                        <p className="text-xs text-slate-600 leading-relaxed">{post.desc}</p>
                        <div className="pt-2 flex justify-between items-center border-t border-slate-200 text-xs">
                          <span className="text-slate-500">Par {post.author}</span>
                          <button onClick={() => speakText(`${post.title}. ${post.desc}`)} className="bg-white px-3 py-1 rounded-lg border border-slate-200 font-bold text-slate-700 hover:text-[#E30613] shadow-sm">
                            🔊 Écouter (FALC)
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'vie' && (
                  <div className="py-8 text-center space-y-2">
                    <span className="text-3xl">☕</span>
                    <h4 className="font-bold text-slate-800 text-sm">Café partagé hebdomadaire</h4>
                    <p className="text-xs text-slate-500">Chaque mardi après-midi, rejoignez l'équipe d'animation au rez-de-chaussée.</p>
                  </div>
                )}

                {activeTab === 'guides' && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold text-slate-700">📄 Règlement intérieur simplifié</div>
                    <div className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold text-slate-700">🧺 Guide d'utilisation de la laverie</div>
                  </div>
                )}

                {activeTab === 'equipe' && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold text-slate-700">👤 Salima Afric (Responsable de résidence)</div>
                    <div className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-bold text-slate-700">👤 Christian M. (Agent de maintenance)</div>
                  </div>
                )}
              </div>

            </main>
          )}

          {/* MODAL SIGNALEMENT */}
          {showModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex justify-center items-center p-4 z-50">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                  <h3 className="font-extrabold text-slate-900 text-sm">🔧 Signaler une panne</h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <form onSubmit={handleIncidentSubmit} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Description du problème</label>
                    <textarea value={incidentText} onChange={(e) => setIncidentText(e.target.value)} className="w-full border border-slate-300 rounded-xl p-3 text-xs h-28 outline-none focus:ring-2 focus:ring-red-500" placeholder="Ex: Ascenseur en panne au bâtiment A..." required></textarea>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-xs font-bold text-slate-600">Annuler</button>
                    <button type="submit" className="bg-[#E30613] text-white px-4 py-2 rounded-xl text-xs font-bold shadow">Envoyer</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* VUE ADMIN */}
          {viewMode === 'admin' && (
            <main className="max-w-3xl w-full mx-auto p-6 flex-1">
              <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                <h2 className="text-lg font-bold text-slate-900">Console Responsable - Publication d'Annonce</h2>
                <form onSubmit={(e) => { e.preventDefault(); alert('Annonce publiée !'); setViewMode('resident'); }} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Titre</label>
                    <input type="text" className="w-full border border-slate-300 rounded-xl p-2.5 text-xs" placeholder="Titre de l'alerte..." required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Message FALC</label>
                    <textarea className="w-full border border-slate-300 rounded-xl p-2.5 text-xs h-24" placeholder="Description..." required></textarea>
                  </div>
                  <button type="submit" className="bg-[#E30613] text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow">Diffuser sur l'intranet</button>
                </form>
              </div>
            </main>
          )}

          {/* VUE KIOSK TV */}
          {viewMode === 'kiosk' && (
            <main className="flex-1 bg-slate-950 p-8 text-white flex flex-col justify-between">
              <div className="flex justify-between items-center pb-4 border-b border-slate-800">
                <h2 className="text-2xl font-extrabold text-red-600">RÉSIDENCE LES OLIVIERS — HALL</h2>
                <span className="text-sm font-bold text-slate-400">ÉCRAN DYNAMIQUE</span>
              </div>
              <div className="grid grid-cols-2 gap-6 my-auto">
                {posts.slice(0, 2).map((p) => (
                  <div key={p.id} className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
                    <span className="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">{p.type}</span>
                    <h3 className="text-xl font-bold text-white">{p.title}</h3>
                    <p className="text-slate-300 text-sm">{p.desc}</p>
                  </div>
                ))}
              </div>
              <div className="text-center text-slate-500 text-xs pt-4 border-t border-slate-800">
                Adoma — Groupe Caisse des Dépôts
              </div>
            </main>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
