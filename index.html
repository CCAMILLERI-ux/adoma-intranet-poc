        apartment: "",
        description: "",
        photoAttached: false,
        urgent: false

        title: "",
        category: "Urgences & Travaux",
        type: "alert",
        date: "Aujourd'hui",
        time: "",

        pinned: false

      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = selectedLanguage === 'en' ? 'en-US' : selectedLanguage === 'ar' ? 'ar-SA' : 'fr-FR';
          window.speechSynthesis.speak(utterance);
        }
      };

      const toggleEventRegistration = (eventId) => {
        setEventsList(prev => prev.map(ev => {
          if (ev.id === eventId) {
            const isRegistering = !ev.userRegistered;
            return {
              ...ev,
              userRegistered: isRegistering,
              participantsCount: isRegistering ? ev.participantsCount + 1 : ev.participantsCount - 1
            };
          }
          return ev;
        }));
      };

      const handleReportSubmit = (e) => {
        e.preventDefault();
        if (!newReport.apartment || !newReport.description) return;

        const createdReport = {
          id: `rep-${Date.now()}`,
          type: newReport.category,
          apartment: `Apt ${newReport.apartment}`,
          date: "À l'instant",
          status: "Reçu",
          description: newReport.description,
          urgent: newReport.urgent
        };

        setReportsList([createdReport, ...reportsList]);
        setReportSuccessMessage(true);
        setTimeout(() => {
          setReportSuccessMessage(false);
          setReportModalOpen(false);
          setNewReport({ category: "Plomberie / Fuite d'eau", apartment: "", description: "", photoAttached: false, urgent: false });
        }, 2000);
      };

        e.preventDefault();
        if (!adminForm.title || !adminForm.description) return;

          id: `news-${Date.now()}`,
          title: adminForm.title,
          category: adminForm.category,
          type: adminForm.type,
          date: adminForm.date || "Immédiat",
          time: adminForm.time,
          description: adminForm.description,
          isNational: false,
          pinned: adminForm.pinned

        setAdminPublishedNotice(true);

          setAdminPublishedNotice(false);
          setAdminForm({ title: "", category: "Urgences & Travaux", type: "alert", date: "Aujourd'hui", time: "", description: "", pinned: false });

                    <h1 className="text-sm font-bold leading-tight flex items-center gap-2">
                      <span>Intranet Résidence</span>
                      <span className="text-xs font-normal bg-red-900/60 text-red-200 border border-red-700/50 px-2 py-0.5 rounded-full">POC Demo</span>
                    </h1>
                    <p className="text-xs text-slate-400">Vaulx-en-Velin "Les Oliviers"</p>
                  </div>
                </div>

                <div className="flex items-center bg-slate-800/90 p-1 rounded-xl border border-slate-700">
                  <button onClick={() => setCurrentView('resident')} className={`flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${currentView === 'resident' ? 'bg-[#A81920] text-white shadow-sm' : 'text-slate-300 hover:text-white'}`}>
                    <Icons.Smartphone />
                    <span>Vue Résident</span>
                  </button>
                  <button onClick={() => setCurrentView('admin')} className={`flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${currentView === 'admin' ? 'bg-[#A81920] text-white shadow-sm' : 'text-slate-300 hover:text-white'}`}>
                    <Icons.Settings />
                    <span>Console Responsable</span>
                  </button>
                  <button onClick={() => setCurrentView('kiosk')} className={`flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${currentView === 'kiosk' ? 'bg-[#A81920] text-white shadow-sm' : 'text-slate-300 hover:text-white'}`}>
                    <Icons.Monitor />
                    <span>Affichage Hall (TV)</span>
                  </button>
                </div>

                {currentView === 'resident' && (
                  <div className="flex items-center space-x-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700 self-end md:self-auto">
                    <Icons.Globe />
                    <button onClick={() => setSelectedLanguage('fr')} className={`text-xs px-2 py-0.5 rounded font-bold ${selectedLanguage === 'fr' ? 'bg-white text-slate-900' : 'text-slate-300'}`}>FR</button>
                    <button onClick={() => setSelectedLanguage('en')} className={`text-xs px-2 py-0.5 rounded font-bold ${selectedLanguage === 'en' ? 'bg-white text-slate-900' : 'text-slate-300'}`}>EN</button>
                    <button onClick={() => setSelectedLanguage('ar')} className={`text-xs px-2 py-0.5 rounded font-bold ${selectedLanguage === 'ar' ? 'bg-white text-slate-900' : 'text-slate-300'}`}>العربية</button>
                    <button onClick={() => setSelectedLanguage('ru')} className={`text-xs px-2 py-0.5 rounded font-bold ${selectedLanguage === 'ru' ? 'bg-white text-slate-900' : 'text-slate-300'}`}>РУ</button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* VUE 1 : ESPACE RÉSIDENT */}
          {currentView === 'resident' && (
            <main className="max-w-4xl mx-auto px-4 py-6 space-y-8 pb-24">
              <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <div className="inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-[#A81920] bg-red-50 px-2.5 py-1 rounded-full mb-2">
                    <Icons.Home />
                    <span>Résidence Les Oliviers</span>
                  </div>
                  <h2 className="text-xl sm:text-2xl font-bold text-slate-900">Bienvenue dans votre résidence</h2>
                  <p className="text-sm text-slate-600 mt-0.5">Retrouvez ici les informations utiles, vos événements et vos contacts.</p>
                </div>
                <div className="flex sm:flex-col items-center sm:items-end justify-between border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100">
                  <div className="text-xs text-slate-500 font-medium">Mercredi 28 Octobre</div>
                  <button onClick={() => setReportModalOpen(true)} className="inline-flex items-center space-x-2 bg-[#A81920] hover:bg-red-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md transition-transform active:scale-95">
                    <Icons.Wrench />
                    <span>Signaler une panne</span>
                  </button>
                </div>
              </div>

              {/* RACCOURCIS */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <a href="#actu" className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center text-center">
                  <div className="w-12 h-12 bg-red-100 text-[#A81920] rounded-2xl flex items-center justify-center mb-2"><Icons.Bell /></div>
                  <span className="text-xs font-bold text-slate-900">Actualités & Alertes</span>
                </a>
                <a href="#events" className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center text-center">
                  <div className="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center mb-2"><Icons.Calendar /></div>
                  <span className="text-xs font-bold text-slate-900">Vie & Animations</span>
                </a>
                <a href="#pratique" className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center text-center">
                  <div className="w-12 h-12 bg-amber-100 text-amber-700 rounded-2xl flex items-center justify-center mb-2"><Icons.Info /></div>
                  <span className="text-xs font-bold text-slate-900">Guides Pratiques</span>
                </a>
                <a href="#equipe" className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center text-center">
                  <div className="w-12 h-12 bg-blue-100 text-blue-700 rounded-2xl flex items-center justify-center mb-2"><Icons.Users /></div>
                  <span className="text-xs font-bold text-slate-900">Mon Équipe</span>
                </a>
              </div>

              {/* SECTION ACTUALITÉS */}
              <section id="actu" className="space-y-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <div className="w-2 h-6 bg-[#A81920] rounded-full"></div>
                    <h3 className="text-lg font-bold text-slate-900">📢 En ce moment (Actualités)</h3>
                  </div>
                  <span className="text-xs font-semibold text-slate-500 bg-slate-200 px-2.5 py-1 rounded-full">{newsList.length} message(s)</span>
                </div>
                <div className="space-y-3">
                  {newsList.map((item) => (
                    <div key={item.id} className={`bg-white rounded-2xl p-5 shadow-sm border ${item.type === 'alert' ? 'border-red-300 bg-red-50/20' : 'border-slate-200'}`}>
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex items-start space-x-3">
                          <div className={`p-3 rounded-xl shrink-0 ${item.type === 'alert' ? 'bg-red-100 text-[#A81920]' : 'bg-slate-100 text-slate-700'}`}>
                            {item.type === 'alert' ? <Icons.AlertTriangle /> : <Icons.Info />}
                          </div>
                          <div>
                            <span className={`text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-md ${item.type === 'alert' ? 'bg-red-100 text-[#A81920]' : 'bg-slate-100 text-slate-700'}`}>
                              {item.category}
                            </span>
                            <h4 className="text-base font-bold text-slate-900 mt-1">{item.title}</h4>
                            <p className="text-xs font-semibold text-red-700 mt-1 flex items-center gap-1"><Icons.Clock /> <span>{item.date} {item.time && `• ${item.time}`}</span></p>
                            <p className="text-sm text-slate-700 mt-2">{item.description}</p>
                          </div>
                        </div>
                        <button onClick={() => speakText(`${item.title}. ${item.description}`)} className="p-2 text-slate-400 hover:text-red-700"><Icons.Volume2 /></button>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              {/* SECTION ANIMATIONS */}
              <section id="events" className="space-y-4">
                <div className="flex items-center space-x-2">
                  <div className="w-2 h-6 bg-emerald-600 rounded-full"></div>
                  <h3 className="text-lg font-bold text-slate-900">📅 La vie de la résidence (Animations)</h3>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {eventsList.map((event) => (
                    <div key={event.id} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col justify-between">
                      <div>
                        <span className="text-[10px] font-bold uppercase text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full">{event.tag}</span>
                        <h4 className="text-base font-bold text-slate-900 mt-2">{event.title}</h4>
                        <p className="text-xs text-slate-600 mt-2"><Icons.Clock /> {event.date} • {event.time}</p>
                        <p className="text-xs text-slate-600 mt-2">{event.description}</p>
                      </div>
                      <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span className="text-xs text-slate-500">{event.participantsCount} inscrit(s)</span>
                        <button onClick={() => toggleEventRegistration(event.id)} className={`text-xs font-bold px-3 py-1.5 rounded-xl ${event.userRegistered ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-900 text-white'}`}>
                          {event.userRegistered ? '✓ Inscrit !' : 'Je participe'}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              {/* SECTION GUIDES */}
              <section id="pratique" className="space-y-4">
                <div className="flex items-center space-x-2">
                  <div className="w-2 h-6 bg-amber-500 rounded-full"></div>
                  <h3 className="text-lg font-bold text-slate-900">🛠️ Guides pratiques & Règlement</h3>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {GUIDES.map((guide) => (
                    <div key={guide.id} className="bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm flex flex-col">
                      <div className="h-32 bg-slate-200 relative">
                        <img src={guide.icon} className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 to-transparent p-3 flex items-end">
                          <h4 className="text-sm font-bold text-white">{guide.title}</h4>
                        </div>
                      </div>
                      <div className="p-4 space-y-2 text-xs text-slate-700">
                        {guide.steps.map((step, idx) => (
                          <div key={idx} className="flex gap-2"><span className="bg-amber-100 text-amber-800 font-bold rounded-full w-4 h-4 text-center shrink-0">{idx+1}</span> <span>{step}</span></div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              {/* SECTION ÉQUIPE */}
              <section id="equipe" className="space-y-4">
                <div className="flex items-center space-x-2">
                  <div className="w-2 h-6 bg-blue-600 rounded-full"></div>
                  <h3 className="text-lg font-bold text-slate-900">👥 Votre équipe de résidence</h3>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {TEAM_MEMBERS.map((member) => (
                    <div key={member.id} className="bg-white rounded-2xl p-4 border border-slate-200 text-center flex flex-col items-center">
                      <img src={member.avatar} className="w-20 h-20 rounded-full object-cover mb-2" />
                      <h4 className="font-bold text-slate-900 text-base">{member.name}</h4>
                      <span className="text-xs text-[#A81920] bg-red-50 px-2 py-0.5 rounded-full font-semibold">{member.role}</span>
                      <p className="text-xs text-slate-600 mt-2">{member.description}</p>
                      <div className="w-full mt-3 pt-3 border-t text-xs text-left space-y-1">
                        <p>🕒 {member.presence}</p>
                        <p>📞 {member.phone}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            </main>
          )}

          {/* VUE 2 : CONSOLE ADMIN */}
          {currentView === 'admin' && (
            <main className="max-w-6xl mx-auto px-4 py-6 space-y-8 pb-24">
              <div className="bg-slate-900 text-white rounded-2xl p-6 shadow-md flex justify-between items-center">
                <div>
                  <span className="text-xs font-bold bg-[#A81920] px-3 py-1 rounded-full uppercase">Espace Gestionnaire</span>
                  <h2 className="text-2xl font-bold mt-2">Console de publication & de gestion</h2>
                </div>
                <div className="text-xs bg-slate-800 p-3 rounded-xl border border-slate-700">
                  <p>Résidence : <strong>Les Oliviers</strong></p>
                  <p>Gestionnaire : <strong>Salima AFRIC</strong></p>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div className="lg:col-span-2 bg-white rounded-2xl p-6 border space-y-4">
                  <h3 className="text-lg font-bold text-slate-900">Créer une alerte / annonce</h3>
                  
                  <div className="flex gap-2 overflow-x-auto pb-2">
                    {TEMPLATES_ADMIN.map((tpl, idx) => (
                      <button key={idx} onClick={() => loadAdminTemplate(tpl)} className="bg-slate-50 border p-2 rounded-xl text-xs font-medium whitespace-nowrap hover:bg-red-50">
                        ⚡ {tpl.title}
                      </button>
                    ))}
                  </div>

                  {adminPublishedNotice && (
                    <div className="bg-emerald-50 border border-emerald-300 text-emerald-800 p-3 rounded-xl text-xs font-bold">
                      ✓ Message publié immédiatement sur l'intranet et l'écran du hall !
                    </div>
                  )}

                  <form onSubmit={handleAdminPublish} className="space-y-4">
                    <input type="text" required placeholder="Titre de l'information *" value={adminForm.title} onChange={(e) => setAdminForm({...adminForm, title: e.target.value})} className="w-full border rounded-xl p-3 text-sm" />
                    <textarea required placeholder="Description détaillée..." value={adminForm.description} onChange={(e) => setAdminForm({...adminForm, description: e.target.value})} className="w-full border rounded-xl p-3 text-sm h-24"></textarea>
                    <button type="submit" className="bg-[#A81920] text-white font-bold px-6 py-3 rounded-xl text-xs shadow hover:bg-red-800">Publier l'annonce</button>
                  </form>
                </div>

                <div className="bg-white rounded-2xl p-6 border space-y-4">
                  <h3 className="text-base font-bold text-slate-900">Signalements pannes reçus ({reportsList.length})</h3>
                  {reportsList.map((rep) => (
                    <div key={rep.id} className="p-3 bg-slate-50 border rounded-xl space-y-1 text-xs">
                      <span className="font-bold text-red-700">{rep.type}</span>
                      <p className="font-semibold">{rep.apartment} • {rep.date}</p>
                      <p className="italic text-slate-600">"{rep.description}"</p>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* VUE 3 : KIOSQUE TV HALL */}
          {currentView === 'kiosk' && (
            <div className="fixed inset-0 bg-slate-950 text-white z-50 p-8 flex flex-col justify-between">
              <div className="flex justify-between items-center border-b border-slate-800 pb-6">
                <div className="flex items-center space-x-4">
                  <div className="bg-white px-4 py-2 rounded-2xl"><AdomaLogo className="h-10" /></div>
                  <div>
                    <h2 className="text-2xl font-bold">Résidence Les Oliviers</h2>
                    <p className="text-sm text-slate-400">Écran d'information du Hall</p>
                  </div>
                </div>
                <button onClick={() => setCurrentView('resident')} className="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold">Quitter le Kiosque</button>
              </div>

              <div className="grid grid-cols-12 gap-8 my-auto">
                <div className="col-span-8 bg-slate-900 border-2 border-red-600 rounded-3xl p-8 space-y-4">
                  <span className="bg-red-600 text-white font-extrabold text-xs px-3 py-1 rounded-full uppercase">INFORMATION PRINCIPALE</span>
                  <h3 className="text-3xl font-black">{newsList[0]?.title}</h3>
                  <p className="text-slate-300 text-lg">{newsList[0]?.description}</p>
                </div>
                <div className="col-span-4 bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                  <h4 className="text-xs font-bold text-emerald-400 uppercase">Prochain Événement</h4>
                  <h5 className="text-xl font-bold">{eventsList[0]?.title}</h5>
                  <p className="text-sm text-slate-400">{eventsList[0]?.date} • {eventsList[0]?.time}</p>
                </div>
              </div>

              <div className="border-t border-slate-800 pt-4 text-xs text-slate-400 text-center">
                Adoma — Groupe Caisse des Dépôts
              </div>
            </div>
          )}

          {/* MODAL SIGNALEMENT PANNE */}
          {reportModalOpen && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-900 text-base">🔧 Signaler une panne</h3>
                  <button onClick={() => setReportModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                {reportSuccessMessage ? (
                  <div className="py-6 text-center text-emerald-700 font-bold">✓ Signalement transmis au responsable !</div>
                ) : (
                  <form onSubmit={handleReportSubmit} className="space-y-3">
                    <input type="text" required placeholder="N° de logement (ex: Apt 204) *" value={newReport.apartment} onChange={(e) => setNewReport({...newReport, apartment: e.target.value})} className="w-full border rounded-xl p-3 text-xs" />
                    <textarea required placeholder="Description de la panne *" value={newReport.description} onChange={(e) => setNewReport({...newReport, description: e.target.value})} className="w-full border rounded-xl p-3 text-xs h-24"></textarea>
                    <button type="submit" className="w-full bg-[#A81920] text-white font-bold py-2.5 rounded-xl text-xs shadow">Envoyer le signalement</button>
                  </form>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
